<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elegant Test | Tes Interaktif</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap">
    <style>
        :root {
            --primary-color: #6c5ce7;
            --secondary-color: #a29bfe;
            --accent-color: #fd79a8;
            --dark-color: #2d3436;
            --light-color: #f5f6fa;
            --success-color: #00b894;
            --warning-color: #fdcb6e;
            --error-color: #d63031;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--light-color);
            color: var(--dark-color);
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 2rem 0;
            text-align: center;
            border-radius: 0 0 20px 20px;
            box-shadow: 0 10px 30px rgba(108, 92, 231, 0.3);
            margin-bottom: 3rem;
        }
        
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }
        
        .subtitle {
            font-weight: 300;
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .test-container {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
            padding: 2.5rem;
            margin-bottom: 2rem;
            transition: all 0.3s ease;
        }
        
        .test-container:hover {
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            transform: translateY(-5px);
        }
        
        .question {
            font-size: 1.3rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
            color: var(--dark-color);
        }
        
        .options {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }
        
        .option {
            background-color: var(--light-color);
            border: 2px solid #dfe6e9;
            border-radius: 10px;
            padding: 1.2rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }
        
        .option:hover {
            border-color: var(--secondary-color);
            background-color: rgba(162, 155, 254, 0.1);
        }
        
        .option.selected {
            border-color: var(--primary-color);
            background-color: rgba(108, 92, 231, 0.1);
        }
        
        .option input {
            margin-right: 1rem;
            accent-color: var(--primary-color);
        }
        
        .progress-container {
            margin-bottom: 2rem;
        }
        
        .progress-bar {
            height: 8px;
            background-color: #dfe6e9;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }
        
        .progress {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
            width: 0%;
            transition: width 0.5s ease;
        }
        
        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #636e72;
        }
        
        .btn {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.3);
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(108, 92, 231, 0.4);
        }
        
        .btn:active {
            transform: translateY(1px);
        }
        
        .btn-secondary {
            background: white;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            box-shadow: none;
        }
        
        .btn-secondary:hover {
            background: rgba(108, 92, 231, 0.1);
            box-shadow: none;
        }
        
        .navigation {
            display: flex;
            justify-content: space-between;
            margin-top: 2rem;
        }
        
        .result-container {
            text-align: center;
            display: none;
        }
        
        .result-icon {
            font-size: 5rem;
            margin-bottom: 1.5rem;
            color: var(--primary-color);
        }
        
        .result-title {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
        }
        
        .result-score {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .result-feedback {
            max-width: 600px;
            margin: 0 auto 2rem;
            color: #636e72;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            
            header {
                padding: 1.5rem 0;
                border-radius: 0 0 15px 15px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .test-container {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>Elegant Test</h1>
            <p class="subtitle">Tes interaktif dengan tampilan elegan</p>
        </div>
    </header>
    
    <div class="container">
        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress" id="progress"></div>
            </div>
            <div class="progress-text">
                <span id="current-question">1</span>
                <span id="total-questions">/10</span>
            </div>
        </div>
        
        <div class="test-container" id="test-container">
            <div class="question" id="question">Pertanyaan akan muncul di sini</div>
            <div class="options" id="options">
                <!-- Opsi akan diisi oleh JavaScript -->
            </div>
            
            <div class="navigation">
                <button class="btn btn-secondary" id="prev-btn" disabled>Sebelumnya</button>
                <button class="btn" id="next-btn">Selanjutnya</button>
            </div>
        </div>
        
        <div class="result-container" id="result-container">
            <div class="result-icon">🎉</div>
            <h2 class="result-title">Tes Selesai!</h2>
            <div class="result-score" id="result-score">0%</div>
            <p class="result-feedback" id="result-feedback">Terima kasih telah menyelesaikan tes ini. Hasil Anda akan ditampilkan di sini.</p>
            <button class="btn" id="restart-btn">Ulangi Tes</button>
        </div>
    </div>
    
    <script>
        // Data pertanyaan
        const questions = [
            {
                question: "Apa warna utama yang digunakan dalam desain ini?",
                options: ["Merah", "Ungu", "Hijau", "Biru"],
                answer: 1
            },
            {
                question: "Manakah dari berikut ini yang BUKAN termasuk dalam palet warna desain ini?",
                options: ["#6c5ce7", "#fd79a8", "#00b894", "#a29bfe"],
                answer: 2
            },
            {
                question: "Font apa yang digunakan dalam desain ini?",
                options: ["Roboto", "Open Sans", "Montserrat", "Poppins"],
                answer: 2
            },
            {
                question: "Apa efek yang terjadi ketika mengarahkan kursor ke tombol utama?",
                options: ["Berubah warna", "Bergerak ke atas", "Menjadi transparan", "Berputar"],
                answer: 1
            },
            {
                question: "Bagaimana sudut border-radius pada container tes?",
                options: ["5px", "10px", "15px", "20px"],
                answer: 2
            },
            {
                question: "Apa warna latar belakang utama website?",
                options: ["Putih", "Abu-abu muda", "Hitam", "Ungu muda"],
                answer: 1
            },
            {
                question: "Bagaimana bayangan (shadow) pada header diterapkan?",
                options: ["Shadow biasa", "Gradient shadow", "Inner shadow", "Multiple shadow"],
                answer: 0
            },
            {
                question: "Apa warna teks untuk pertanyaan?",
                options: ["#2d3436", "#636e72", "#6c5ce7", "#000000"],
                answer: 0
            },
            {
                question: "Apa efek transisi yang digunakan pada tombol?",
                options: ["0.2s ease", "0.3s ease", "0.5s ease", "1s ease"],
                answer: 1
            },
            {
                question: "Bagaimana progress bar diwarnai?",
                options: ["Warna solid", "Gradient horizontal", "Gradient vertikal", "Pattern"],
                answer: 1
            }
        ];
        
        // Elemen DOM
        const questionElement = document.getElementById('question');
        const optionsElement = document.getElementById('options');
        const currentQuestionElement = document.getElementById('current-question');
        const totalQuestionsElement = document.getElementById('total-questions');
        const progressElement = document.getElementById('progress');
        const prevButton = document.getElementById('prev-btn');
        const nextButton = document.getElementById('next-btn');
        const testContainer = document.getElementById('test-container');
        const resultContainer = document.getElementById('result-container');
        const resultScoreElement = document.getElementById('result-score');
        const resultFeedbackElement = document.getElementById('result-feedback');
        const restartButton = document.getElementById('restart-btn');
        
        // Variabel state
        let currentQuestionIndex = 0;
        let answers = new Array(questions.length).fill(null);
        let score = 0;
        
        // Inisialisasi tes
        function initTest() {
            totalQuestionsElement.textContent = `/${questions.length}`;
            showQuestion();
        }
        
        // Tampilkan pertanyaan
        function showQuestion() {
            const question = questions[currentQuestionIndex];
            questionElement.textContent = question.question;
            
            optionsElement.innerHTML = '';
            question.options.forEach((option, index) => {
                const optionElement = document.createElement('label');
                optionElement.className = `option ${answers[currentQuestionIndex] === index ? 'selected' : ''}`;
                optionElement.innerHTML = `
                    <input type="radio" name="option" value="${index}" ${answers[currentQuestionIndex] === index ? 'checked' : ''}>
                    ${option}
                `;
                optionElement.addEventListener('click', () => selectOption(index));
                optionsElement.appendChild(optionElement);
            });
            
            currentQuestionElement.textContent = currentQuestionIndex + 1;
            progressElement.style.width = `${((currentQuestionIndex + 1) / questions.length) * 100}%`;
            
            // Atur status tombol navigasi
            prevButton.disabled = currentQuestionIndex === 0;
            nextButton.textContent = currentQuestionIndex === questions.length - 1 ? 'Selesai' : 'Selanjutnya';
        }
        
        // Pilih opsi
        function selectOption(optionIndex) {
            answers[currentQuestionIndex] = optionIndex;
            showQuestion();
        }
        
        // Navigasi pertanyaan
        function goToNextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                showQuestion();
            } else {
                showResult();
            }
        }
        
        function goToPrevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                showQuestion();
            }
        }
        
        // Tampilkan hasil
        function showResult() {
            // Hitung skor
            score = 0;
            answers.forEach((answer, index) => {
                if (answer === questions[index].answer) {
                    score++;
                }
            });
            
            const percentage = Math.round((score / questions.length) * 100);
            
            // Tampilkan hasil
            resultScoreElement.textContent = `${percentage}%`;
            
            // Berikan feedback berdasarkan skor
            let feedback = '';
            if (percentage >= 90) {
                feedback = "Luar biasa! Anda sangat memperhatikan detail desain.";
            } else if (percentage >= 70) {
                feedback = "Bagus! Anda memiliki pemahaman yang baik tentang desain ini.";
            } else if (percentage >= 50) {
                feedback = "Cukup baik. Anda memperhatikan beberapa aspek desain.";
            } else {
                feedback = "Anda mungkin perlu lebih memperhatikan detail desain.";
            }
            
            resultFeedbackElement.textContent = feedback;
            
            // Tampilkan container hasil dan sembunyikan tes
            testContainer.style.display = 'none';
            resultContainer.style.display = 'block';
        }
        
        // Mulai ulang tes
        function restartTest() {
            currentQuestionIndex = 0;
            answers = new Array(questions.length).fill(null);
            testContainer.style.display = 'block';
            resultContainer.style.display = 'none';
            showQuestion();
        }
        
        // Event listeners
        nextButton.addEventListener('click', goToNextQuestion);
        prevButton.addEventListener('click', goToPrevQuestion);
        restartButton.addEventListener('click', restartTest);
        
        // Jalankan tes
        initTest();
    </script>
</body>
</html>
